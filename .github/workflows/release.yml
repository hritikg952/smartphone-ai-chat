name: Build Installable APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      # The release variant is intentionally unsigned until production signing
      # credentials are configured. Build debug here so the artifact can be
      # downloaded and installed directly on a test device.
      - name: Build installable debug APK
        run: ./gradlew assembleDebug

      - name: Verify APK is signed and installable
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-installable-apk
          path: app/build/outputs/apk/debug/app-debug.apk
